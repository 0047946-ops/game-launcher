name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Java 環境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安裝 Cordova 與 Android 工具
        run: |
          npm install -g cordova
          cordova telemetry off

      - name: 建立 Cordova 專案結構
        run: |
          cordova create myApp com.idle.lineage.launcher IdleLineageLauncher
          cd myApp
          cordova platform add android

      - name: 覆蓋網頁與外掛核心資產
        run: |
          rm -rf myApp/www/*
          cp index.html myApp/www/index.html

      - name: 強制解開 WebView 跨域與安全限制
        run: |
          cd myApp
          python3 -c "
          with open('config.xml', 'r') as f:
              content = f.read()
          
          # 注入全權限與略過安全策略的偏好設定
          security_prefs = '''
              <preference name=\"AllowInlineMediaPlayback\" value=\"true\" />
              <preference name=\"AndroidInsecureFileModeEnabled\" value=\"true\" />
              <preference name=\"webviewbounce\" value=\"false\" />
              <preference name=\"DisallowOverscroll\" value=\"true\" />
              <preference name=\"BackgroundColor\" value=\"0xff000000\" />
          '''
          
          content = content.replace('</widget>', security_prefs + '</widget>')
          
          with open('config.xml', 'w') as f:
              f.write(content)
          "

      - name: 編譯 Android Debug APK
        run: |
          cd myApp
          cordova build android --debug

      - name: 上傳編譯完成的 APK 檔案
        uses: actions/upload-artifact@v4
        with:
          name: game-launcher-apk
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
