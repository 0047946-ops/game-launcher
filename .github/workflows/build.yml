name: Build WebAPK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 打包網頁資產
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: 上傳打包產物
        uses: actions/upload-artifact@v3
        with:
          name: GameLauncher-Web
          path: dist/
