name: Build WebAPK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 確認檔案結構
        run: |
          ls -la

      - name: 上傳打包產物
        uses: actions/upload-artifact@v4
        with:
          name: game-launcher-apk-assets
          path: index.html
