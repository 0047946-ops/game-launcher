name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Java 環境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Android SDK 環境
        uses: android-actions/setup-android@v3

      - name: 建構原生 Android 專案結構
        run: |
          mkdir -p app/src/main/java/com/idle/lineage/launcher
          mkdir -p app/src/main/assets

          # 確保複製 index.html 至原生資源目錄
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "Error: index.html not found!" && exit 1
          fi

          # 建立 settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IdleLineageLauncher"
          include ':app'
          EOF

          # 建立 build.gradle (根目錄)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 建立 app/build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.idle.lineage.launcher'
              compileSdk 34

              defaultConfig {
                  applicationId "com.idle.lineage.launcher"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 建立 AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="放置天堂雙外掛啟動器"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 建立 MainActivity.java (原生 JavaScript 注入邏輯)
          cat << 'EOF' > app/src/main/java/com/idle/lineage/launcher/MainActivity.java
          package com.idle.lineage.launcher;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          
                          // 當進入遊戲遠端伺服器網址時，觸發原生層 JavaScript 強制注入
                          if (url != null && url.startsWith("http")) {
                              String js1 = "if(!window.__main_plugin_loaded){ window.__main_plugin_loaded=true; var s1 = document.createElement('script'); s1.src = 'https://raw.githubusercontent.com/qcc781192000/idle-lineage-plugin/main/main.user.js'; document.head.appendChild(s1); }";
                              String js2 = "if(!window.__gm_shop_loaded){ window.__gm_shop_loaded=true; var s2 = document.createElement('script'); s2.src = 'https://kid0924.github.io/idle-lineage-class/klh_GMShop.js?t=' + Date.now(); document.head.appendChild(s2); }";

                              view.evaluateJavascript(js1, null);
                              view.evaluateJavascript(js2, null);
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: 建立 Gradle Wrapper 並編譯 APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug

      - name: 上傳編譯完成的 APK 檔案
        uses: actions/upload-artifact@v4
        with:
          name: game-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
