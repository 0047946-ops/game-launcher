<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>放置天堂 - 極速同步啟動門戶</title>
    <style>
        :root {
            --bg: #0b0c10; --card: #1f2833; --accent: #66fcf1; --text: #c5c6c7;
            --success: #00ff41; --error: #ff6b6b; --warning: #ffa500;
        }
        body { 
            margin:0; padding:12px; background:var(--bg); color:var(--text); 
            font-family:-apple-system, BlinkMacSystemFont, sans-serif;
            display:flex; justify-content:center; align-items:center; min-height:100vh;
            box-sizing:border-box;
        }
        .card { 
            width:100%; max-width:480px; background:var(--card); 
            border:1px solid var(--accent); border-radius:16px; padding:20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); box-sizing:border-box;
        }
        h2 { text-align:center; color:var(--accent); margin:0 0 10px 0; font-size: 1.35rem; font-weight:900; }
        .sub-title { text-align:center; font-size:0.75rem; color:var(--warning); margin-bottom:16px; font-weight:bold; }
        
        .box {
            background:#0b0c10; border:1px dashed var(--accent); border-radius:10px;
            padding:14px; margin-bottom:14px;
        }
        .label { display:block; font-size:0.85rem; font-weight:bold; color:var(--accent); margin-bottom:6px; }
        
        .btn {
            width:100%; padding:14px; margin:6px 0; border:none; border-radius:10px;
            font-size:0.95rem; font-weight:900; cursor:pointer; transition:all 0.2s;
            box-sizing:border-box; text-align:center;
        }
        .btn-direct { background:linear-gradient(135deg, #00ff41, #00b32d); color:#000; }
        .btn-file { background:linear-gradient(135deg, #ffa500, #ff7c00); color:#000; }
        .btn-sync { background:linear-gradient(135deg, #66fcf1, #45a29e); color:#0b0c10; }
        .btn-plugin { background:linear-gradient(135deg, #e0c3fc, #8ec5fc); color:#000; }

        select, input[type="text"] {
            width:100%; padding:12px; background:#1f2833; color:#fff;
            border:1px solid var(--accent); border-radius:8px; font-size:0.85rem;
            box-sizing:border-box; margin-bottom:8px;
        }
        
        .status {
            margin-top:10px; padding:10px; background:rgba(0,0,0,0.6); 
            border-radius:8px; font-size:0.8rem; word-break:break-all; line-height:1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>⚡ 放置天堂 - 極速門戶</h2>
    <div class="sub-title">📱 原生橋接模式已啟用 | 檔案雙向同步無感轉移</div>

    <!-- 伺服器選擇 -->
    <div class="box">
        <label class="label">🌐 選擇目標伺服器</label>
        <select id="server">
            <option value="pp771007">伺服器二 (pp771007 - 雙外掛全功能)</option>
            <option value="shines871">伺服器一 (shines871 - 離線增強)</option>
        </select>
        <button class="btn btn-direct" onclick="directPlay()">🎮 免存檔直接進入遊戲</button>
    </div>

    <!-- JSON 檔案處理 -->
    <div class="box">
        <label class="label">📂 JSON 存檔極速處理</label>
        
        <input type="file" id="fileInput" accept=".json,.txt" style="display:none;" onchange="handleFileSelect(event)">
        
        <button class="btn btn-file" onclick="document.getElementById('fileInput').click()">📂 選擇手機中的 .json 檔匯入登入</button>
        <button class="btn btn-sync" onclick="exportCurrentSave()">📤 一鍵匯出本機進度 JSON 檔</button>
    </div>

    <!-- 剪貼簿一鍵感應 -->
    <div class="box">
        <label class="label">📋 快貼模式</label>
        <button class="btn" style="background:#a8ff78; color:#000;" onclick="readFromClipboard()">⚡ 自動讀取手機剪貼簿並登入</button>
    </div>

    <!-- 🔥 玩家添加自訂外掛腳本區 -->
    <div class="box">
        <label class="label">🧩 玩家自訂第三方外掛腳本 URL</label>
        <input type="text" id="pluginUrlInput" placeholder="請輸入外掛 JS 網址 (https://...)">
        <button class="btn btn-plugin" onclick="saveCustomPlugin()">💾 儲存並啟用自訂外掛腳本</button>
    </div>

    <div id="msg" class="status" style="display:none;"></div>
</div>

<script>
    const SERVERS = {
        'shines871': 'https://shines871.github.io/idle-lineage-class/',
        'pp771007': 'https://pp771007.github.io/idle-lineage-class/'
    };

    window.onload = function() {
        // 初始化讀取自訂外掛網址
        if (window.AndroidBridge && window.AndroidBridge.getCustomPluginUrl) {
            const currentUrl = window.AndroidBridge.getCustomPluginUrl();
            if (currentUrl) {
                document.getElementById('pluginUrlInput').value = currentUrl;
            }
        }
    };

    function log(txt, type = 'info') {
        const el = document.getElementById('msg');
        el.style.display = 'block';
        el.style.color = type === 'error' ? '#ff6b6b' : (type === 'success' ? '#00ff41' : '#66fcf1');
        el.innerHTML = txt;
    }

    // 1. 免存檔直接開啟
    function directPlay() {
        const url = SERVERS[document.getElementById('server').value];
        log('⚡ 正在載入遊戲創角選單...', 'success');
        setTimeout(() => { window.location.href = url + '#action=create'; }, 300);
    }

    // 2. 處理玩家選取 .json 檔案
    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const content = ev.target.result.trim();
                saveAndLaunch(content, `檔案「${file.name}」載入成功！`);
            } catch (err) {
                log('❌ 檔案解析失敗，請確定是否為合法 JSON 存檔！', 'error');
            }
        };
        reader.readAsText(file);
    }

    // 3. 一鍵匯出存檔至 Download 資料夾
    function exportCurrentSave() {
        let save = localStorage.getItem('RAW_INJECT_SAVE_DATA');
        if (!save && window.AndroidBridge && window.AndroidBridge.loadGameData) {
            save = window.AndroidBridge.loadGameData();
        }

        if (!save) {
            return log('⚠️ 目前本機沒有角色存檔資料！', 'error');
        }

        if (window.AndroidBridge && window.AndroidBridge.saveBase64File) {
            const base64 = btoa(unescape(encodeURIComponent(save)));
            window.AndroidBridge.saveBase64File(base64, `fable5_save_${Date.now()}.json`);
            log('✅ 存檔已指令匯出，請至手機 Download 資料夾查看！', 'success');
        } else {
            log('⚠️ 未偵測到原生 Android 橋樑', 'error');
        }
    }

    // 4. 自動讀取剪貼簿
    function readFromClipboard() {
        if (window.AndroidBridge && window.AndroidBridge.getClipboardText) {
            const clipText = window.AndroidBridge.getClipboardText();
            if (clipText && clipText.length > 10) {
                saveAndLaunch(clipText, '✅ 成功從手機剪貼簿讀取存檔！');
            } else {
                log('⚠️ 手機剪貼簿中沒有找到有效的存檔內容！', 'error');
            }
        } else {
            log('⚠️ 剪貼簿讀取未獲得權限或原生接口未開啟', 'error');
        }
    }

    // 5. 儲存自訂外掛網址
    function saveCustomPlugin() {
        const url = document.getElementById('pluginUrlInput').value.trim();
        if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
            return log('⚠️ 請輸入以 http:// 或 https:// 開頭的完整外掛網址！', 'error');
        }

        if (window.AndroidBridge && window.AndroidBridge.saveCustomPluginUrl) {
            window.AndroidBridge.saveCustomPluginUrl(url);
            log(url ? '✅ 自訂外掛網址已儲存！進入遊戲時將自動載入。' : '✅ 已清除自訂外掛網址！', 'success');
        } else {
            log('⚠️ 未偵測到原生 Android 橋樑', 'error');
        }
    }

    // 統一注入並跳轉
    function saveAndLaunch(saveData, successMsg) {
        localStorage.setItem('RAW_INJECT_SAVE_DATA', saveData);
        
        if (window.AndroidBridge && window.AndroidBridge.saveGameData) {
            window.AndroidBridge.saveGameData(saveData);
        }

        log(`${successMsg}<br>🚀 正在開啟遊戲...`, 'success');

        setTimeout(() => {
            const url = SERVERS[document.getElementById('server').value];
            window.location.href = url + '#action=inject';
        }, 400);
    }
</script>
</body>
</html>
