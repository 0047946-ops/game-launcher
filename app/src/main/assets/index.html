<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>放置天堂 - 極速門戶</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background: linear-gradient(180deg, #0f172a, #1e2937); color: #e2e8f0; margin:0; padding:0; }
        .container { max-width: 520px; margin: 0 auto; padding: 20px 15px; }
        h1 { color: #67e8f9; text-align: center; margin: 10px 0 5px; }
        .subtitle { text-align: center; color: #a5b4fc; margin-bottom: 20px; }
        select, input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; font-size: 16px; border: none; }
        button { font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-green { background: #22c55e; color: #000; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-orange { background: #f59e0b; color: white; }
        .btn-purple { background: #8b5cf6; color: white; }
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; margin: 15px 0; }
        .status { padding: 12px; border-radius: 10px; text-align: center; margin: 10px 0; background: rgba(165,180,252,0.1); }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ 放置天堂 - 極速門戶</h1>
    <p class="subtitle">雙網址 & 雙外掛自動同步模式</p>

    <div class="status" id="status">準備就緒，請選擇伺服器</div>

    <!-- 伺服器選擇 -->
    <div class="section">
        <strong>🎯 選擇目標遊戲網址</strong>
        <select id="server">
            <option value="https://pp771007.github.io/idle-lineage-class/">pp771007.github.io (推薦 - 全功能加掛版)</option>
            <option value="https://shines871.github.io/idle-lineage-class/">shines871.github.io (原版)</option>
        </select>
    </div>

    <button class="btn-green" onclick="launchGame()">🚀 免存檔直接進入遊戲</button>

    <!-- JSON 處理 -->
    <div class="section">
        <strong>📦 JSON 人物資料極速處理</strong>
        <button class="btn-orange" onclick="importJSON()">📂 選擇 .json 檔匯入</button>
        <button class="btn-blue" onclick="exportJSON()">💾 一鍵匯出目前進度</button>
    </div>

    <!-- 快貼模式 -->
    <div class="section">
        <strong>⚡ 快貼模式</strong>
        <button class="btn-green" onclick="pasteAndLoad()">📋 自動讀取剪貼簿並登入</button>
    </div>

    <!-- 外掛配置 -->
    <div class="section">
        <strong>🔧 雙外掛腳本 URL 配置</strong>
        <input type="text" id="plugin1" placeholder="外掛腳本 1 (主外掛)" value="https://cdn.jsdelivr.net/gh/qcc781192000/idle-lineage-plugin@main/main.user.js">
        <input type="text" id="plugin2" placeholder="外掛腳本 2 (GM商店或其他)" value="https://kid0924.github.io/idle-lineage-class/klh_GMShop.js">
        <button class="btn-purple" onclick="savePlugins()">💾 儲存外掛設定</button>
    </div>

    <script>
        // 儲存外掛設定
        function savePlugins() {
            localStorage.setItem('customPlugin1', document.getElementById('plugin1').value);
            localStorage.setItem('customPlugin2', document.getElementById('plugin2').value);
            alert('✅ 外掛設定已儲存！下次進入遊戲將自動注入');
        }

        function setStatus(msg, color = "#a5b4fc") {
            document.getElementById("status").innerHTML = msg;
            document.getElementById("status").style.color = color;
        }

        // 進入遊戲
        function launchGame() {
            const url = document.getElementById("server").value;
            setStatus("🚀 進入遊戲中...", "#67e8f9");
            window.location.href = url;
        }

        // JSON 匯入
        function importJSON() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json";
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        localStorage.clear();
                        Object.keys(data).forEach(key => {
                            localStorage.setItem(key, typeof data[key] === 'object' ? JSON.stringify(data[key]) : data[key]);
                        });
                        setStatus("✅ 匯入成功！正在重新載入遊戲...", "#22c55e");
                        setTimeout(() => window.location.reload(), 1500);
                    } catch (err) {
                        setStatus("❌ JSON 格式錯誤", "#ef4444");
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // JSON 匯出
        function exportJSON() {
            const saveData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) saveData[key] = localStorage.getItem(key);
            }
            if (Object.keys(saveData).length === 0) {
                alert("❌ 目前沒有找到存檔資料");
                return;
            }
            const blob = new Blob([JSON.stringify(saveData, null, 2)], {type: "application/json"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `放置天堂_存檔_${new Date().toISOString().slice(0,16).replace(/[:T]/g, '-')}.json`;
            a.click();
            setStatus("✅ 存檔已成功下載！", "#22c55e");
        }

        // 剪貼簿快貼
        async function pasteAndLoad() {
            try {
                const text = await navigator.clipboard.readText();
                const data = JSON.parse(text);
                localStorage.clear();
                Object.keys(data).forEach(key => {
                    localStorage.setItem(key, typeof data[key] === 'object' ? JSON.stringify(data[key]) : data[key]);
                });
                setStatus("✅ 剪貼簿匯入成功！重新載入中...", "#22c55e");
                setTimeout(() => window.location.reload(), 1200);
            } catch (e) {
                alert("❌ 剪貼簿內容不是有效存檔，或無法讀取剪貼簿");
            }
        }

        // 頁面載入
        window.onload = () => {
            setStatus("✅ 極速門戶已就緒<br>推薦使用 pp771007 加掛版", "#67e8f9");
            
            // 載入已儲存的外掛設定
            const p1 = localStorage.getItem('customPlugin1');
            const p2 = localStorage.getItem('customPlugin2');
            if (p1) document.getElementById('plugin1').value = p1;
            if (p2) document.getElementById('plugin2').value = p2;
        };
    </script>
</div>
</body>
</html>
