<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>放置天堂 - 100% 同步門戶 v3.8</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #66fcf1;
            --text-color: #c5c6c7;
            --border-color: #45a29e;
            --success: #00ff41;
            --error: #ff6b6b;
            --warning: #ffa500;
        }
        body {
            margin:0; padding:0; background:var(--bg-color); color:var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display:flex; justify-content:center; align-items:center; min-height:100vh;
        }
        .launcher-card {
            width: 92%; max-width: 560px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 16px;
            padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.9);
        }
        .header-title { 
            font-size: 1.45rem; text-align:center; color:var(--accent-color); 
            margin:0 0 10px 0; font-weight:900; 
        }
        .version-badge {
            text-align: center; font-size: 0.75rem; color: var(--warning);
            margin-bottom: 16px; font-weight: bold;
        }
        .section-box {
            border: 1px dashed var(--border-color); padding:16px; border-radius:12px;
            background:#0b0c10; margin-bottom:18px;
        }
        .form-label { display:block; font-weight:700; margin-bottom:8px; color:var(--accent-color); }
        .custom-input, .custom-textarea {
            width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-color);
            background:#1f2833; color:#fff; box-sizing:border-box; font-size:0.85rem;
        }
        .custom-textarea { min-height:75px; resize:vertical; font-family: monospace; font-size: 0.75rem; }
        
        .btn-main {
            width:100%; padding:14px; margin:8px 0;
            background:linear-gradient(135deg, #66fcf1, #45a29e);
            color:#0b0c10; border:none; border-radius:10px; font-size:1.05rem; font-weight:900;
            cursor:pointer; transition: all 0.25s;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(102,252,241,0.3); }
        
        .btn-direct {
            background: linear-gradient(135deg, #00ff41, #00b32d);
            color: #000;
        }
        
        .btn-sub {
            padding:10px 12px; background:#1f2833; color:var(--accent-color);
            border:1px solid var(--accent-color); border-radius:6px; cursor:pointer;
            font-size: 0.75rem; font-weight: 600;
        }
        .btn-sub:hover { background: var(--accent-color); color: #0b0c10; }
        
        .status-box {
            margin-top:12px; padding:12px; border-radius:8px; font-size:0.8rem;
            background: rgba(0,0,0,0.4); border: 1px solid var(--border-color);
        }
        .status-info { color: var(--accent-color); }
        .status-success { color: var(--success); }
        .status-error { color: var(--error); }
        .status-warning { color: var(--warning); }
        
        .button-group { display:flex; gap:8px; margin-top:10px; flex-wrap: wrap; }
        .button-group > * { flex: 1; min-width: 75px; }
        
        .sync-guide { 
            background: rgba(102,252,241,0.1); border: 1px solid var(--accent-color);
            padding: 12px; border-radius: 8px; font-size: 0.8rem; margin: 12px 0;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="launcher-card">
    <h1 class="header-title">⚔️ 放置天堂 - 同步門戶 v3.8</h1>
    <div class="version-badge">✨ 支援「免存檔直進」| 雙外掛 / 離線增強預載</div>

    <!-- 伺服器選擇 -->
    <div class="section-box">
        <label class="form-label">🌐 選擇目標伺服器節點</label>
        <select id="server-select" class="custom-input">
            <option value="pp771007">伺服器二 (pp771007 - 雙外掛全功能模式)</option>
            <option value="shines871">伺服器一 (shines871 - 離線掛機增強模式)</option>
        </select>
    </div>

    <!-- 核心操作按鈕區 (直進 vs 帶存檔) -->
    <div style="margin-bottom: 18px;">
        <!-- 路徑 1：完全免存檔，直接開局（建立角色） -->
        <button class="btn-main btn-direct" onclick="launchDirectNoSave()">🎮 免存檔直接進入遊戲 (自動載入外掛功能)</button>
        
        <!-- 路徑 2：攜帶 JSON / SIG1 存檔注入進入 -->
        <button class="btn-main" onclick="launchGameWithSave()">🚀 寫入存檔並進入遊戲</button>
    </div>

    <!-- 角色資料 (僅在有舊存檔時使用) -->
    <div class="section-box">
        <label class="form-label">📦 存檔注入區 (無存檔可留空)</label>
        <textarea id="save-json-textarea" class="custom-textarea" placeholder="若有 JSON 或 SIG1 舊存檔請貼於此處..."></textarea>
        
        <div class="button-group">
            <button class="btn-sub" onclick="document.getElementById('json-file-input').click()">📁 讀取檔案</button>
            <button class="btn-sub" onclick="exportFromGame()">📤 導出存檔</button>
            <button class="btn-sub" onclick="validateData()">✓ 驗證存檔</button>
        </div>
        <input type="file" id="json-file-input" accept=".json,.txt" style="display:none;" onchange="handleFileSelect(event)">

        <!-- 資料檢驗 -->
        <div id="validation-status" class="status-box" style="display:none;">
            <div id="validation-content"></div>
        </div>
    </div>

    <button class="btn-main" id="clear-btn" style="background: linear-gradient(135deg, #ff6b6b, #ff4757); margin-top: 0; font-size:0.9rem;" onclick="clearBeforeLaunch()">🗑️ 清空本機資料後進入</button>

    <!-- 狀態訊息 -->
    <div id="status-message" class="status-box" style="display:none;">
        <div id="status-content"></div>
    </div>
</div>

<script>
    const CONFIG = {
        GAME_SAVE_KEYS: [
            'lineage_idle_save_1', 'lineage_idle_save_2', 'lineage_idle_save_3', 'lineage_idle_save_4',
            'lineage_idle_warehouse_classic', 'lineage_idle_warehouse_normal',
            'lineage_idle_warehouse_traditional', 'lineage_idle_warehouse_traditional_normal',
            'lineage_idle_pets_classic', 'lineage_idle_pets_normal',
            'lineage_idle_pets_traditional', 'lineage_idle_pets_traditional_normal',
            'lineage_idle_dex_equipt_classic', 'lineage_idle_dex_equipt_normal',
            'lineage_idle_dex_relic_classic', 'lineage_idle_dex_relic_normal',
            'lineage_idle_dex_misc_classic', 'lineage_idle_dex_misc_normal',
            'lineage_idle_dex_cardex_classic', 'lineage_idle_dex_cardex_normal'
        ],
        SERVER_URLS: {
            'shines871': 'https://shines871.github.io/idle-lineage-class/',
            'pp771007': 'https://pp771007.github.io/idle-lineage-class/'
        }
    };

    // SIG1 容錯解析器
    function parseSIG1(rawData) {
        if (typeof rawData !== 'string') return null;
        let cleanText = rawData.replace(/[\r\n\t\s]/g, '');

        if (!cleanText.startsWith('SIG1:')) return cleanText;

        try {
            let body = cleanText.substring(5);
            let base64Candidate = body.includes(':') ? body.split(':').reduce((a, b) => a.length > b.length ? a : b) : body;
            base64Candidate = base64Candidate.replace(/[^A-Za-z0-9+/=]/g, '');

            while (base64Candidate.length % 4 !== 0) base64Candidate += '=';

            const binaryStr = atob(base64Candidate);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
            
            return new TextDecoder('utf-8').decode(bytes);
        } catch (e) {
            return null;
        }
    }

    function showStatus(message, type = 'info') {
        const statusEl = document.getElementById('status-message');
        const contentEl = document.getElementById('status-content');
        contentEl.innerHTML = `<span class="status-${type}">${message}</span>`;
        statusEl.style.display = 'block';
    }

    function showValidation(content) {
        const validationEl = document.getElementById('validation-status');
        const contentEl = document.getElementById('validation-content');
        contentEl.innerHTML = content;
        validationEl.style.display = 'block';
    }

    // 1. 🔥【全新功能】：免存檔直接進入遊戲 (創建角色 / 自動加載外掛)
    function launchDirectNoSave() {
        const serverKey = document.getElementById('server-select').value;
        const baseUrl = CONFIG.SERVER_URLS[serverKey];
        const serverName = serverKey === 'pp771007' ? '伺服器二 (雙外掛模式)' : '伺服器一 (增強離線模式)';

        showStatus(`⚡ 正在進入 ${serverName}...<br>已開啟乾淨模式，請直接創建角色！`, 'success');

        setTimeout(() => {
            // 直接跳轉，不夾帶任何存檔 Hash，避免死循環
            window.location.href = baseUrl;
        }, 400);
    }

    // 2. 帶存檔進入遊戲
    function launchGameWithSave() {
        const dataStr = document.getElementById('save-json-textarea').value.trim();
        
        if (!dataStr) {
            showStatus('⚠️ 存檔輸入區是空的！如果是新角色，請點擊綠色的「免存檔直接進入遊戲」按鈕！', 'warning');
            return;
        }

        try {
            let data = dataStr;

            if (dataStr.startsWith('SIG1:')) {
                const decoded = parseSIG1(dataStr);
                if (!decoded) throw new Error('SIG1 解析失敗，請檢查資料字串');
                data = decoded;
            }

            JSON.parse(data);

            const serverKey = document.getElementById('server-select').value;
            const baseUrl = CONFIG.SERVER_URLS[serverKey];
            
            localStorage.setItem('PRELOAD_INJECT_SAVE', data);
            const encoded = encodeURIComponent(data);
            const finalUrl = baseUrl + '#inject_save=' + encoded;

            showStatus('⏳ 正在寫入角色資料並啟動...', 'info');
            
            setTimeout(() => {
                window.location.href = finalUrl;
            }, 400);
            
        } catch(e) {
            showStatus(`❌ 注入失敗: ${e.message}`, 'error');
        }
    }

    function validateData() {
        const input = document.getElementById('save-json-textarea').value.trim();
        if (!input) return showValidation(`<span class="status-error">❌ 請先輸入資料</span>`);

        try {
            let data = input.startsWith('SIG1:') ? parseSIG1(input) : input;
            if (!data) return showValidation(`<span class="status-error">❌ SIG1 解析失敗</span>`);

            const parsed = JSON.parse(data);
            const saveKeys = CONFIG.GAME_SAVE_KEYS.filter(key => parsed.hasOwnProperty(key));
            const sizeKB = (new Blob([data]).size / 1024).toFixed(2);
            
            showValidation(`
                <div><span class="status-success">✓ 存檔格式正確！</span></div>
                <div style="margin-top: 6px; font-size: 0.75rem;">
                    <div>📊 解構大小: ${sizeKB} KB | 💾 識別項目: ${saveKeys.length}/${CONFIG.GAME_SAVE_KEYS.length}</div>
                </div>
            `);
        } catch(e) {
            showValidation(`<span class="status-error">❌ JSON 結構錯誤: ${e.message}</span>`);
        }
    }

    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(ev) {
            document.getElementById('save-json-textarea').value = ev.target.result;
            showStatus('✅ 檔案讀取成功！', 'success');
            setTimeout(() => validateData(), 300);
        };
        reader.readAsText(file);
    }

    function exportFromGame() {
        showStatus('💡 請在進入遊戲後點擊「備份存檔」→「導出 JSON」進行備份！', 'info');
    }

    function clearBeforeLaunch() {
        if (confirm('⚠️ 確定要清空本機的所有舊資料嗎？')) {
            CONFIG.GAME_SAVE_KEYS.forEach(key => localStorage.removeItem(key));
            showStatus('✅ 已清空舊資料！可點擊上方綠色按鈕進入創建新角色。', 'success');
        }
    }
</script>
</body>
</html>
