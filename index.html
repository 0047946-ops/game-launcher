<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 防快取標籤配置 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>放置天堂 - 商業級全能自動同步啟動器</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #66fcf1;
            --accent-hover: #45a29e;
            --text-color: #c5c6c7;
            --border-color: #45a29e;
            --danger-color: #ff4d4d;
            --success-color: #2ecc71;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .launcher-card {
            width: 92%;
            max-width: 480px;
            margin: 20px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .header-title {
            font-size: 1.5rem;
            text-align: center;
            color: var(--accent-color);
            margin: 0 0 20px 0;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .section-box {
            border: 1px dashed var(--border-color);
            padding: 14px;
            border-radius: 10px;
            background-color: #0b0c10;
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        .custom-select, .custom-input, .custom-textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #1f2833;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #66fcf1, #45a29e);
            color: #0b0c10;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.3);
            transition: transform 0.1s ease;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .btn-sub {
            padding: 8px 12px;
            background: #1f2833;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
        }

        .btn-sub:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        .plugin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2833;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 0.8rem;
            border: 1px solid #333;
        }

        .plugin-url {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
            color: #fff;
        }

        .btn-del {
            background: var(--danger-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .system-status {
            margin-top: 16px;
            font-size: 0.82rem;
            color: #888;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="launcher-ui" class="launcher-card">
    <h1 class="header-title">⚔️ 放置天堂全能雲端啟動器</h1>

    <!-- 1. 運行伺服器節點選擇 -->
    <div class="section-box">
        <label class="form-label" for="server-select">🌐 選擇運行伺服器節點：</label>
        <select id="server-select" class="custom-select">
            <option value="https://pp771007.github.io/idle-lineage-class/">伺服器二 (pp771007 - 雙外掛 / 全功能模式)</option>
            <option value="https://shines871.github.io/idle-lineage-class/">伺服器一 (shines871 - 離線掛機增強模式)</option>
        </select>
    </div>

    <!-- 2. 雲端同步與帳號識別識別碼（實現資料實體化核心） -->
    <div class="section-box">
        <label class="form-label">☁️ 雲端跨端同步識別碼 (Account Sync Key)：</label>
        <input type="text" id="sync-key-input" class="custom-input" placeholder="輸入或生成您的專屬同步通行碼">
        <div style="display: flex; gap: 8px;">
            <button class="btn-sub" style="flex: 1;" onclick="generateSyncKey()">🔑 生成新通行碼</button>
            <button class="btn-sub" style="flex: 1;" onclick="pullCloudSave()">☁️ 從雲端同步存檔</button>
        </div>
    </div>

    <!-- 3. 本機存檔備份與手動橋接 -->
    <div class="section-box">
        <label class="form-label">💾 快捷備份 / 手動存檔注入：</label>
        <textarea id="save-input" class="custom-textarea" rows="2" placeholder="貼上存檔碼，或將此處產生的存檔備份攜走..."></textarea>
        <div style="display: flex; gap: 8px;">
            <button class="btn-sub" style="flex: 1; background: var(--success-color); color:#000; border:none;" onclick="importSaveData()">📥 寫入本機存檔</button>
            <button class="btn-sub" style="flex: 1;" onclick="exportSaveData()">📤 讀取當前存檔</button>
        </div>
    </div>

    <!-- 4. 玩家自訂外掛腳本鏈管理 -->
    <div class="section-box">
        <label class="form-label">🧩 玩家自訂外掛腳本鏈：</label>
        <input type="text" id="plugin-input" class="custom-input" placeholder="貼上自訂腳本網址 (https://...)">
        <button class="btn-sub" style="width:100%;" onclick="addPlugin()">➕ 掛載自訂腳本網址</button>
        <div id="plugin-list" style="margin-top: 8px;"></div>
    </div>

    <!-- 5. 啟動遊戲按鈕 -->
    <button class="btn-main" onclick="startGameEngine()">🚀 啟動遊戲引擎並動態注入</button>

    <div id="status-display" class="system-status">內部版本 v1.3.0 | 全域雲端橋接與版本監控系統已就緒</div>
</div>

<script>
    // 企業級系統核心配置
    const SYSTEM_VERSION = "1.3.0";
    const VERSION_CHECK_URL = "https://0047946-ops.github.io/game-launcher/version.json";
    const STORAGE_KEY_PLUGINS = "USER_CUSTOM_PLUGINS";
    const STORAGE_KEY_SYNC_ID = "USER_CLOUD_SYNC_KEY";

    // 系統初始化鏈
    document.addEventListener("DOMContentLoaded", () => {
        executeVersionCheck();
        initSyncKey();
        renderPlugins();
        checkUrlPayload();
    });

    // 1. 全自動版本比對與防快取熱更新
    function executeVersionCheck() {
        const currentUrl = new URL(window.location.href);
        if (!currentUrl.searchParams.has('v')) {
            currentUrl.searchParams.set('v', Date.now().toString());
            window.location.replace(currentUrl.toString());
            return;
        }

        fetch(`${VERSION_CHECK_URL}?t=${Date.now()}`)
            .then(res => res.json())
            .then(data => {
                if (data.latestVersion && data.latestVersion !== SYSTEM_VERSION) {
                    if (confirm(`🎉 發現最新版本啟動器 (v${data.latestVersion})！\n\n更新說明：\n${data.updateLog || '無'}\n\n是否立即下載新版 APK / 載入更新？`)) {
                        window.location.href = data.downloadUrl;
                    }
                }
            })
            .catch(err => console.log("版本檢查跳過:", err));
    }

    // 2. 雲端同步通行碼維護
    function initSyncKey() {
        let key = localStorage.getItem(STORAGE_KEY_SYNC_ID);
        if (!key) {
            key = "KEY_" + Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem(STORAGE_KEY_SYNC_ID, key);
        }
        document.getElementById('sync-key-input').value = key;
    }

    function generateSyncKey() {
        const newKey = "KEY_" + Math.random().toString(36).substring(2, 10).toUpperCase();
        localStorage.setItem(STORAGE_KEY_SYNC_ID, newKey);
        document.getElementById('sync-key-input').value = newKey;
        alert("🎉 已生成新的通行碼：" + newKey + "\n請在另一端輸入此碼以進行雲端對接！");
    }

    // 3. 從雲端拉取角色資料（預留 API 橋接節點）
    function pullCloudSave() {
        const key = document.getElementById('sync-key-input').value.trim();
        if (!key) return alert("請輸入有效的同步通行碼！");
        
        const statusElement = document.getElementById('status-display');
        statusElement.innerText = "正在從雲端節點拉取數據...";
        statusElement.style.color = "#66fcf1";

        // 模擬雲端 KV 擷取過程
        setTimeout(() => {
            alert("☁️ 雲端同步頻道已連線！如果雲端有更新記錄，將自動同步至本機。");
            statusElement.innerText = "當前版本 v1.3.0 | 雲端同步完成";
            statusElement.style.color = "#888";
        }, 1000);
    }

    // 4. URL 載荷自動解包（實現免複製自動同步）
    function checkUrlPayload() {
        const hash = window.location.hash;
        if (hash && hash.startsWith('#save=')) {
            try {
                const rawData = decodeURIComponent(hash.replace('#save=', ''));
                const parsed = JSON.parse(rawData);
                Object.keys(parsed).forEach(k => localStorage.setItem(k, parsed[k]));
                alert("⚡ 檢測到來自網頁端傳遞的角色載荷，已自動同步寫入 APK！");
                window.location.hash = "";
            } catch(e) {
                console.error("URL 載荷解析失敗", e);
            }
        }
    }

    // 5. 本機存檔匯入與匯出
    function importSaveData() {
        const str = document.getElementById('save-input').value.trim();
        if (!str) return alert('請先貼上存檔文字！');
        try {
            const data = JSON.parse(str);
            Object.keys(data).forEach(k => localStorage.setItem(k, data[k]));
            alert('✅ 角色存檔已成功注入！');
            document.getElementById('save-input').value = "";
        } catch(e) {
            alert('❌ 存檔格式錯誤！');
        }
    }

    function exportSaveData() {
        const saveObj = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            saveObj[key] = localStorage.getItem(key);
        }
        document.getElementById('save-input').value = JSON.stringify(saveObj);
        alert('📤 已將本機所有角色資料打包匯出至下方文字框！');
    }

    // 6. 玩家自訂外掛腳本鏈管理
    function getPlugins() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY_PLUGINS)) || []; }
        catch(e) { return []; }
    }

    function renderPlugins() {
        const listContainer = document.getElementById('plugin-list');
        const plugins = getPlugins();
        listContainer.innerHTML = "";

        if (plugins.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; color:#666; font-size:0.78rem;">無自訂腳本 (預設自動掛載官方外掛鏈)</div>`;
            return;
        }

        plugins.forEach((url, index) => {
            const item = document.createElement('div');
            item.className = 'plugin-item';
            item.innerHTML = `
                <span class="plugin-url" title="${url}">${url}</span>
                <button class="btn-del" onclick="removePlugin(${index})">刪除</button>
            `;
            listContainer.appendChild(item);
        });
    }

    function addPlugin() {
        const input = document.getElementById('plugin-input');
        const url = input.value.trim();
        if (!url || !url.startsWith('http')) return alert('請輸入正確的 HTTP/HTTPS 腳本網址！');

        const plugins = getPlugins();
        if (plugins.includes(url)) return alert('該腳本已被掛載！');

        plugins.push(url);
        localStorage.setItem(STORAGE_KEY_PLUGINS, JSON.stringify(plugins));
        input.value = "";
        renderPlugins();
    }

    function removePlugin(index) {
        const plugins = getPlugins();
        plugins.splice(index, 1);
        localStorage.setItem(STORAGE_KEY_PLUGINS, JSON.stringify(plugins));
        renderPlugins();
    }

    // 7. 動態 DOM 代理解析啟動引擎
    function startGameEngine() {
        const targetUrl = document.getElementById('server-select').value;
        const statusElement = document.getElementById('status-display');
        
        statusElement.innerText = "正在解析伺服器 DOM 並注入全域外掛鏈...";
        statusElement.style.color = "#66fcf1";

        document.getElementById('launcher-ui').style.display = 'none';

        fetch(targetUrl)
            .then(res => res.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();

                setTimeout(() => {
                    // 官方主外掛鏈注入
                    injectScript('https://cdn.jsdelivr.net/gh/qcc781192000/idle-lineage-plugin@main/main.user.js');
                    // GM 商店注入
                    injectScript('https://kid0924.github.io/idle-lineage-class/klh_GMShop.js?t=' + Date.now());

                    // 特殊伺服器補丁
                    if (targetUrl.includes('shines871.github.io')) {
                        injectScript('https://pp771007.github.io/idle-lineage-class/offline.js?t=' + Date.now());
                    }

                    // 玩家自訂外掛腳本鏈逐一注入
                    getPlugins().forEach(scriptUrl => {
                        injectScript(scriptUrl);
                    });
                }, 800);
            })
            .catch(() => {
                window.location.href = targetUrl;
            });
    }

    function injectScript(src) {
        const s = document.createElement('script');
        s.src = src;
        document.head.appendChild(s);
    }
</script>

</body>
</html>
