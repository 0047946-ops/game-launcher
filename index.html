<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放置天堂雙外掛啟動器</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; }
        #menu { padding: 30px; max-width: 480px; margin: 50px auto; background: #1e1e1e; border-radius: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.7); border: 1px solid #333; }
        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #00adb5; font-weight: bold; font-size: 15px; }
        select { width: 100%; padding: 14px; box-sizing: border-box; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 15px; outline: none; }
        button { width: 100%; padding: 16px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(40,167,69,0.3); }
    </style>
</head>
<body>

    <div id="menu">
        <h2 style="text-align:center; margin-top:0; color:#fff;">🎮 放置天堂雙外掛啟動器</h2>
        <p style="text-align:center; color:#888; font-size:13px; margin-bottom:25px;">Android 原生 WebView 注入版</p>
        
        <div class="group">
            <label>選擇遊戲伺服器：</label>
            <select id="server-select">
                <option value="https://shines871.github.io/idle-lineage-class/">伺服器二 (shines871)</option>
                <option value="https://pp771007.github.io/idle-lineage-class/">伺服器一 (pp771007)</option>
            </select>
        </div>

        <button onclick="launchGame()">🚀 啟動遊戲並載入雙外掛</button>
    </div>

<script>
    function launchGame() {
        const gameUrl = document.getElementById('server-select').value;
        window.location.href = gameUrl;
    }
</script>
</body>
</html>
