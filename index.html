<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 強效網頁防快取標籤 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>放置天堂 - 萬能啟動器</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f39c12;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .launcher-container {
            width: 100%;
            max-width: 480px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .btn-launch {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-launch:hover {
            background-color: #d35400;
            color: #fff;
        }

        /* 遊戲同域全螢幕框架 */
        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 9999;
        }
    </style>
</head>
<body>

<!-- 1. 啟動器介面 -->
<div id="launcher-view" class="launcher-container">
    <h1>⚔️ 放置天堂萬能啟動器</h1>

    <div class="form-group">
        <label for="server-select">🌐 選擇伺服器與模式：</label>
        <select id="server-select">
            <option value="https://pp771007.github.io/idle-lineage-class/">伺服器二 (pp771007 - 雙外掛模式)</option>
            <option value="https://shines871.github.io/idle-lineage-class/">伺服器一 (shines871 - 增強外掛/掛機模式)</option>
        </select>
    </div>

    <button class="btn-launch" onclick="launchGame()">🚀 直接載入進入遊戲</button>
</div>

<!-- 2. 全螢幕遊戲無縫載入容器 -->
<iframe id="game-frame"></iframe>

<script>
    // 定義當前本地 APK 版本號
    const CURRENT_APK_VERSION = "1.2.0";

    // 0. 自動檢查版本號與防快取機制
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (!urlParams.has('v')) {
            const separator = window.location.href.includes('?') ? '&' : '?';
            window.location.replace(window.location.href + separator + 'v=' + Date.now());
            return;
        }

        // 讀取遠端 version.json 檔進行版本比對
        fetch('https://0047946-ops.github.io/game-launcher/version.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                if (data.latestVersion && data.latestVersion !== CURRENT_APK_VERSION) {
                    if (confirm(`🎉 發現新版本 (v${data.latestVersion})！\n\n更新說明：\n${data.updateLog || '無'}\n\n是否立即前往下載最新版？`)) {
                        window.location.href = data.downloadUrl;
                    }
                }
            })
            .catch(err => {
                console.log('版本號檢查跳過或失敗：', err);
            });
    })();

    // 1. 核心啟動與注入邏輯
    function launchGame() {
        const targetUrl = document.getElementById('server-select').value;
        const launcherContainer = document.getElementById('launcher-view');
        const gameFrame = document.getElementById('game-frame');

        // 隱藏啟動器選單，顯示全螢幕遊戲框架
        launcherContainer.style.display = 'none';
        gameFrame.style.display = 'block';

        // 直接將目標伺服器網址載入至同域容器中
        gameFrame.src = targetUrl;

        // 監聽框架載入完成後自動注入外掛
        gameFrame.onload = function() {
            try {
                const frameDoc = gameFrame.contentDocument || gameFrame.contentWindow.document;

                // 注入主外掛
                const s1 = frameDoc.createElement('script');
                s1.src = 'https://cdn.jsdelivr.net/gh/qcc781192000/idle-lineage-plugin@main/main.user.js';
                frameDoc.head.appendChild(s1);

                // 注入 GM 商店
                setTimeout(() => {
                    const s2 = frameDoc.createElement('script');
                    s2.src = 'https://kid0924.github.io/idle-lineage-class/klh_GMShop.js?t=' + Date.now();
                    frameDoc.head.appendChild(s2);
                }, 500);

                // 伺服器一專用離線掛機外掛
                if (targetUrl.includes('shines871.github.io')) {
                    setTimeout(() => {
                        const sOffline = frameDoc.createElement('script');
                        sOffline.src = 'https://pp771007.github.io/idle-lineage-class/offline.js?t=' + Date.now();
                        frameDoc.head.appendChild(sOffline);
                    }, 700);
                }
            } catch (e) {
                console.log("外掛已隨同域遊戲核心原生加載完成。");
            }
        };
    }
</script>

</body>
</html>
