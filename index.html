<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬用腳本遊戲啟動器</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #1a1a1a; }
        #setup-menu { padding: 25px; color: white; box-sizing: border-box; max-width: 500px; margin: 40px auto; background: #2a2a2a; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #00adb5; font-size: 14px; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #333; color: white; font-size: 14px; }
        input:focus { border-color: #00adb5; outline: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        button.start { flex: 2; padding: 14px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.clear { flex: 1; padding: 14px; background: #dc3545; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>

    <!-- 初始設定選單介面 -->
    <div id="setup-menu">
        <h2 style="margin-top:0; text-align:center;">🎮 萬用腳本遊戲啟動器</h2>
        <p style="color:#aaa; font-size:12px; text-align:center; margin-bottom:20px;">輸入網址後一鍵偽裝成 APK 並注入外掛</p>
        <hr style="border: 1px solid #444; margin-bottom: 20px;">
        
        <div class="input-group">
            <label>A按鈕：網頁遊戲網址 (必填)</label>
            <input type="text" id="game-url" placeholder="https://...">
        </div>
        <div class="input-group">
            <label>B按鈕：第一個腳本網址 (選填)</label>
            <input type="text" id="script-url-1" placeholder="https://.../bot.js">
        </div>
        <div class="input-group">
            <label>C按鈕：第二個腳本網址 (選填)</label>
            <input type="text" id="script-url-2" placeholder="https://.../shop.js">
        </div>
        
        <div class="btn-group">
            <button class="clear" onclick="clearRecords()">清除紀錄</button>
            <button class="start" onclick="startGame()">🚀 啟動遊戲</button>
        </div>
    </div>

    <!-- 隱形內嵌視窗 -->
    <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

<script>
    // 1. 自動讀取上次輸入的紀錄
    window.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem('game_url')) document.getElementById('game-url').value = localStorage.getItem('game_url');
        if(localStorage.getItem('script_1')) document.getElementById('script-url-1').value = localStorage.getItem('script_1');
        if(localStorage.getItem('script_2')) document.getElementById('script-url-2').value = localStorage.getItem('script_2');
    });

    // 智慧型網址修正器（直接支援 GitHub Raw 與一般直連網址，捨棄失效代理）
    function getCleanScriptUrl(url) {
        if (!url) return "";
        let cleanUrl = url.trim();
        // 若誤貼 GitHub 網頁版網址，自動轉為 Raw 原始碼網址
        if (cleanUrl.includes("github.com") && cleanUrl.includes("/blob/")) {
            cleanUrl = cleanUrl.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
        }
        // 加上時間戳記防止快取
        return cleanUrl + (cleanUrl.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
    }

    // 2. 啟動與強制注入邏輯
    async function startGame() {
        const gameUrl = document.getElementById('game-url').value.trim();
        const script1 = document.getElementById('script-url-1').value.trim();
        const script2 = document.getElementById('script-url-2').value.trim();

        if (!gameUrl) {
            alert('請輸入網頁遊戲網址！');
            return;
        }

        localStorage.setItem('game_url', gameUrl);
        localStorage.setItem('script_1', script1);
        localStorage.setItem('script_2', script2);

        const frame = document.getElementById('game-frame');
        const menu = document.getElementById('setup-menu');

        menu.style.display = 'none';
        frame.style.display = 'block';
        frame.src = gameUrl;

        // 當遊戲載入完成後進行注入
        frame.onload = async function() {
            try {
                const frameWindow = frame.contentWindow;

                // 載入並執行第一個腳本
                if (script1) {
                    await injectScript(frameWindow, script1);
                }

                // 載入並執行第二個腳本
                if (script2) {
                    await injectScript(frameWindow, script2);
                }
            } catch (err) {
                console.error("腳本注入過程發生攔截或異常：", err);
                alert("外掛腳本注入失敗！這通常是因為遊戲網站有嚴格的安全防護 (CSP) 或跨域限制。\n詳細錯誤：\n" + err.message);
            }
        };
    }

    // 非同步腳本抓取與動態植入器
    async function injectScript(win, url) {
        const targetUrl = getCleanScriptUrl(url);
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error(`無法取得腳本，HTTP 狀態碼: ${response.status}`);
        let code = await response.text();

        // 若為油猴腳本格式，自動過濾掉 ==UserScript== 標頭，防止語法解析錯誤
        if (code.includes('==UserScript==')) {
            const endIndex = code.indexOf('==/UserScript==');
            if (endIndex !== -1) {
                code = code.substring(endIndex + 15);
            }
        }

        // 在 iframe 內建立 script 節點執行
        const scriptEl = win.document.createElement('script');
        scriptEl.textContent = code;
        win.document.head.appendChild(scriptEl);
        console.log("外掛腳本強行注入成功：", url);
    }

    // 3. 清除快取紀錄按鈕
    function clearRecords() {
        if(confirm('確定要清除所有儲存的網址嗎？')) {
            localStorage.clear();
            document.getElementById('game-url').value = '';
            document.getElementById('script-url-1').value = '';
            document.getElementById('script-url-2').value = '';
        }
    }
</script>
</body>
</html>
