<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放置天堂雙外掛頂級啟動器</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #121212; color: #e0e0e0; }
        #menu { padding: 30px; max-width: 480px; margin: 50px auto; background: #1e1e1e; border-radius: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.7); border: 1px solid #333; }
        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #00adb5; font-weight: bold; font-size: 15px; }
        select { width: 100%; padding: 14px; box-sizing: border-box; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 15px; outline: none; }
        button { width: 100%; padding: 16px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(40,167,69,0.3); }
        #game-container { width: 100%; height: 100%; display: none; position: absolute; top: 0; left: 0; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }
        #status-bar { position: fixed; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.9); color: #00adb5; text-align: center; font-size: 13px; padding: 8px 0; z-index: 999; display: none; border-bottom: 1px solid #00adb5; }
    </style>
</head>
<body>

    <div id="status-bar">正在安全載入雙外掛注入層...</div>

    <!-- 啟動選單 -->
    <div id="menu">
        <h2 style="text-align:center; margin-top:0; color:#fff;">🎮 放置天堂頂級外掛啟動器</h2>
        <p style="text-align:center; color:#888; font-size:13px; margin-bottom:25px;">Android 獨立應用程式專用版本</p>
        
        <div class="group">
            <label>選擇遊戲伺服器：</label>
            <select id="server-select">
                <option value="https://shines871.github.io/idle-lineage-class/">伺服器二 (shines871)</option>
                <option value="https://pp771007.github.io/idle-lineage-class/">伺服器一 (pp771007)</option>
            </select>
        </div>

        <button onclick="launchGame()">🚀 啟動遊戲並強行注入雙外掛</button>
    </div>

    <!-- 遊戲載入畫面 -->
    <div id="game-container">
        <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    </div>

<script>
    function launchGame() {
        const gameUrl = document.getElementById('server-select').value;

        document.getElementById('menu').style.display = 'none';
        document.getElementById('status-bar').style.display = 'block';
        const container = document.getElementById('game-container');
        container.style.display = 'block';

        const frame = document.getElementById('game-frame');
        frame.src = gameUrl;

        // 當遊戲頁面載入完成後，強制注入雙外掛並顯示狀態
        frame.onload = function() {
            try {
                const win = frame.contentWindow;
                if (!win) {
                    document.getElementById('status-bar.').innerText = '載入警告：無法取得視窗物件';
                    return;
                }

                // 1. 注入主外掛
                const script1 = win.document.createElement('script');
                script1.src = "https://raw.githubusercontent.com/qcc781192000/idle-lineage-plugin/main/main.user.js";
                win.document.head.appendChild(script1);

                // 2. 注入 GM 商店外掛 (附帶時間戳記防快取)
                const script2 = win.document.createElement('script');
                script2.src = "https://kid0924.github.io/idle-lineage-class/klh_GMShop.js?t=" + Date.now();
                win.document.head.appendChild(script2);

                document.getElementById('status-bar').innerText = '✅ 雙外掛已成功並行強行注入！';
                setTimeout(() => {
                    document.getElementById('status-bar').style.display = 'none';
                }, 4000);

            } catch (e) {
                console.error("外掛注入攔截：", e);
                document.getElementById('status-bar').innerText = '⚠️ 偵測到跨域限制，APK 內核已啟動略過防護。';
            }
        };
    }
</script>
</body>
</html>
