<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>放置天堂 - 全能自動同步啟動器</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #66fcf1;
            --text-color: #c5c6c7;
            --border-color: #45a29e;
            --danger-color: #ff4d4d;
            --success-color: #2ecc71;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .launcher-card {
            width: 92%;
            max-width: 480px;
            margin: 20px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .header-title {
            font-size: 1.5rem;
            text-align: center;
            color: var(--accent-color);
            margin: 0 0 20px 0;
            font-weight: 800;
        }

        .section-box {
            border: 1px dashed var(--border-color);
            padding: 14px;
            border-radius: 10px;
            background-color: #0b0c10;
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        .custom-select, .custom-input, .custom-textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #1f2833;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #66fcf1, #45a29e);
            color: #0b0c10;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.3);
        }

        .btn-sub {
            padding: 8px 12px;
            background: #1f2833;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 6px;
        }

        .plugin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2833;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 0.8rem;
            border: 1px solid #333;
        }

        .plugin-url {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
            color: #fff;
        }

        .btn-del {
            background: var(--danger-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .system-status {
            margin-top: 16px;
            font-size: 0.82rem;
            color: #888;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="launcher-ui" class="launcher-card">
    <h1 class="header-title">⚔️ 放置天堂全能雲端啟動器</h1>

    <!-- 1. 伺服器選擇 -->
    <div class="section-box">
        <label class="form-label" for="server-select">🌐 選擇運行伺服器節點：</label>
        <select id="server-select" class="custom-select">
            <option value="https://pp771007.github.io/idle-lineage-class/">伺服器二 (pp771007 - 雙外掛 / 全功能模式)</option>
            <option value="https://shines871.github.io/idle-lineage-class/">伺服器一 (shines871 - 離線掛機增強模式)</option>
        </select>
    </div>

    <!-- 2. 存檔快捷注入工具（備用） -->
    <div class="section-box">
        <label class="form-label">💾 快速注入存檔至目標伺服器：</label>
        <textarea id="save-input" class="custom-textarea" rows="2" placeholder="貼上 Chrome 網頁版導出的存檔文字..."></textarea>
        <button class="btn-sub" style="width: 100%; background: var(--success-color); color:#000; border:none;" onclick="injectSaveToTarget()">📥 一鍵注入存檔並進入遊戲</button>
    </div>

    <!-- 3. 自訂外掛腳本鏈管理 -->
    <div class="section-box">
        <label class="form-label">🧩 玩家自訂外掛腳本鏈：</label>
        <input type="text" id="plugin-input" class="custom-input" placeholder="貼上自訂腳本網址 (https://...)">
        <button class="btn-sub" style="width:100%;" onclick="addPlugin()">➕ 掛載自訂腳本網址</button>
        <div id="plugin-list" style="margin-top: 8px;"></div>
    </div>

    <!-- 4. 啟動按鈕 -->
    <button class="btn-main" onclick="directToTargetGame()">🚀 切換至目標伺服器 (讀取原網頁角色)</button>

    <div id="status-display" class="system-status">當前版本 v1.3.0 | 原生同源資料流模式已啟動</div>
</div>

<script>
    const SYSTEM_VERSION = "1.3.0";
    const VERSION_CHECK_URL = "https://0047946-ops.github.io/game-launcher/version.json";
    const STORAGE_KEY_PLUGINS = "USER_CUSTOM_PLUGINS";

    document.addEventListener("DOMContentLoaded", () => {
        executeVersionCheck();
        renderPlugins();
    });

    // 1. 版本檢查
    function executeVersionCheck() {
        const currentUrl = new URL(window.location.href);
        if (!currentUrl.searchParams.has('v')) {
            currentUrl.searchParams.set('v', Date.now().toString());
            window.location.replace(currentUrl.toString());
            return;
        }

        fetch(`${VERSION_CHECK_URL}?t=${Date.now()}`)
            .then(res => res.json())
            .then(data => {
                if (data.latestVersion && data.latestVersion !== SYSTEM_VERSION) {
                    if (confirm(`🎉 發現最新版本啟動器 (v${data.latestVersion})！\n\n更新說明：\n${data.updateLog || '無'}\n\n是否立即下載新版？`)) {
                        window.location.href = data.downloadUrl;
                    }
                }
            })
            .catch(() => {});
    }

    // 2. 玩家自訂外掛管理
    function getPlugins() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY_PLUGINS)) || []; }
        catch(e) { return []; }
    }

    function renderPlugins() {
        const listContainer = document.getElementById('plugin-list');
        const plugins = getPlugins();
        listContainer.innerHTML = "";

        if (plugins.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; color:#666; font-size:0.78rem;">無自訂腳本</div>`;
            return;
        }

        plugins.forEach((url, index) => {
            const item = document.createElement('div');
            item.className = 'plugin-item';
            item.innerHTML = `
                <span class="plugin-url" title="${url}">${url}</span>
                <button class="btn-del" onclick="removePlugin(${index})">刪除</button>
            `;
            listContainer.appendChild(item);
        });
    }

    function addPlugin() {
        const input = document.getElementById('plugin-input');
        const url = input.value.trim();
        if (!url || !url.startsWith('http')) return alert('請輸入正確的 HTTP/HTTPS 網址！');

        const plugins = getPlugins();
        if (plugins.includes(url)) return alert('腳本已存在！');

        plugins.push(url);
        localStorage.setItem(STORAGE_KEY_PLUGINS, JSON.stringify(plugins));
        input.value = "";
        renderPlugins();
    }

    function removePlugin(index) {
        const plugins = getPlugins();
        plugins.splice(index, 1);
        localStorage.setItem(STORAGE_KEY_PLUGINS, JSON.stringify(plugins));
        renderPlugins();
    }

    // 3. 直接切換至目標伺服器（真正讀取原本 Google 瀏覽器第 4 張圖的角色資料！）
    function directToTargetGame() {
        const targetUrl = document.getElementById('server-select').value;
        // 真正跳轉網址，確保網址列變成 pp771007.github.io
        window.location.href = targetUrl;
    }

    // 4. 如果是跨端/跨裝置，可點擊一鍵把文字存檔帶過去寫入
    function injectSaveToTarget() {
        const str = document.getElementById('save-input').value.trim();
        if (!str) return alert('請先貼上存檔文字！');
        
        const targetUrl = document.getElementById('server-select').value;
        // 將存檔放在 URL Hash 帶過去
        const encodedSave = encodeURIComponent(str);
        window.location.href = targetUrl + "#inject_save=" + encodedSave;
    }
</script>

</body>
</html>
