<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>放置天堂 - 100% 同步門戶 v2.0</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #66fcf1;
            --text-color: #c5c6c7;
            --border-color: #45a29e;
        }
        body {
            margin:0; padding:0; background:var(--bg-color); color:var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display:flex; justify-content:center; align-items:center; min-height:100vh;
        }
        .launcher-card {
            width: 92%; max-width: 500px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 16px;
            padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.9);
        }
        .header-title { font-size: 1.45rem; text-align:center; color:var(--accent-color); margin:0 0 20px 0; font-weight:900; }
        .section-box {
            border: 1px dashed var(--border-color); padding:16px; border-radius:12px;
            background:#0b0c10; margin-bottom:18px;
        }
        .form-label { display:block; font-weight:700; margin-bottom:8px; color:var(--accent-color); }
        .custom-input, .custom-textarea {
            width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-color);
            background:#1f2833; color:#fff; box-sizing:border-box; font-size:0.85rem;
        }
        .custom-textarea { min-height:120px; resize:vertical; }
        .btn-main {
            width:100%; padding:16px; margin:12px 0 8px;
            background:linear-gradient(135deg, #66fcf1, #45a29e);
            color:#0b0c10; border:none; border-radius:10px; font-size:1.1rem; font-weight:900;
            cursor:pointer;
        }
        .btn-sub {
            padding:10px 12px; background:#1f2833; color:var(--accent-color);
            border:1px solid var(--accent-color); border-radius:6px; cursor:pointer;
        }
        .status { margin-top:15px; text-align:center; font-size:0.8rem; color:#888; }
    </style>
</head>
<body>

<div class="launcher-card">
    <h1 class="header-title">⚔️ 放置天堂 - 100% JSON 同步 v2.0</h1>

    <div class="section-box">
        <label class="form-label">🌐 選擇目標伺服器</label>
        <select id="server-select" class="custom-input">
            <option value="https://pp771007.github.io/idle-lineage-class/">伺服器二 (pp771007 - 雙外掛模式)</option>
            <option value="https://shines871.github.io/idle-lineage-class/">伺服器一 (shines871 - 離線增強模式)</option>
        </select>
    </div>

    <div class="section-box">
        <label class="form-label">📦 角色資料 JSON（支援 APK ↔ 網頁）</label>
        <textarea id="save-json-textarea" class="custom-textarea" placeholder="貼上 JSON 或點擊下方按鈕讀取..."></textarea>
        
        <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn-sub" onclick="document.getElementById('json-file-input').click()">📁 讀取 .json 檔案</button>
            <button class="btn-sub" onclick="exportFullDataToJSON()">📤 完整匯出 (推薦)</button>
            <button class="btn-sub" onclick="clearAndImport()">🗑️ 清空後匯入</button>
        </div>
        <input type="file" id="json-file-input" accept=".json" style="display:none;" onchange="handleFileSelect(event)">
    </div>

    <button class="btn-main" onclick="launchGameWithJSON()">🚀 寫入資料並進入遊戲</button>

    <div class="status">
        v2.0 | 已強化 localStorage + 清理機制 | 適合 APK 與網頁雙向同步
    </div>
</div>

<script>
    const STORAGE_KEY_SAVE = "GLOBAL_CHARACTER_SAVE_JSON";

    // 完整匯出（推薦使用這個）
    async function exportFullDataToJSON() {
        try {
            const data = {};

            // 1. 抓取 localStorage 全部
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                data[key] = localStorage.getItem(key);
            }

            // 2. 抓取 sessionStorage
            data._sessionStorage = {};
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                data._sessionStorage[key] = sessionStorage.getItem(key);
            }

            // 3. 加上時間戳與版本
            data._exportInfo = {
                version: "2.0",
                timestamp: new Date().toISOString(),
                type: "IdleLineage_Full_Save"
            };

            const jsonStr = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = `IdleLineage_FullSave_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
            a.click();
            
            URL.revokeObjectURL(url);
            alert('✅ 完整存檔已匯出！\n\n請把這個檔案傳到手機後，在 APK 內匯入。');
        } catch (e) {
            alert('匯出失敗：' + e.message);
        }
    }

    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            document.getElementById('save-json-textarea').value = ev.target.result;
            alert('✅ JSON 檔案讀取成功！');
        };
        reader.readAsText(file);
    }

    function clearAndImport() {
        if (confirm('⚠️ 此操作會先清空目前所有遊戲資料，再匯入新存檔，確定要繼續嗎？')) {
            localStorage.clear();
            sessionStorage.clear();
            launchGameWithJSON(true);
        }
    }

    function launchGameWithJSON(clearFirst = false) {
        const targetUrl = document.getElementById('server-select').value;
        let jsonText = document.getElementById('save-json-textarea').value.trim();

        if (jsonText) {
            try {
                JSON.parse(jsonText); // 驗證
                localStorage.setItem(STORAGE_KEY_SAVE, jsonText);

                const encoded = encodeURIComponent(jsonText);
                let finalUrl = targetUrl;
                
                if (targetUrl.includes('?')) {
                    finalUrl += "&inject_json=" + encoded;
                } else {
                    finalUrl += "#inject_json=" + encoded;
                }

                window.location.href = finalUrl;
            } catch(e) {
                alert('❌ JSON 格式錯誤，請確認後再試！');
            }
        } else {
            window.location.href = targetUrl;
        }
    }

    // 自動載入上次存檔
    window.onload = () => {
        const saved = localStorage.getItem(STORAGE_KEY_SAVE);
        if (saved) {
            document.getElementById('save-json-textarea').value = saved;
        }
    };
</script>
</body>
</html>
