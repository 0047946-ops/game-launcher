<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放置天堂外掛啟動器</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; }
        #menu { padding: 30px; width: 90%; max-width: 450px; background: #2a2a2a; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); text-align: center; }
        .group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #00adb5; font-weight: bold; font-size: 14px; }
        select { width: 100%; padding: 14px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #333; color: white; font-size: 14px; }
        button { width: 100%; padding: 16px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        p { color: #aaa; font-size: 12px; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="menu">
        <h2 style="margin-top:0;">🎮 放置天堂外掛導航器</h2>
        <p>由於瀏覽器嚴格限制跨域注入，建議安裝手機端支援 Userscript（如 Tampermonkey）的瀏覽器（如 Kiwi Browser），並直接造訪下方伺服器即可完美自動載入外掛！</p>
        
        <div class="group">
            <label>選擇要前往的遊戲伺服器：</label>
            <select id="server-select">
                <option value="https://shines871.github.io/idle-lineage-class/">伺服器二 (shines871)</option>
                <option value="https://pp771007.github.io/idle-lineage-class/">伺服器一 (pp771007)</option>
            </select>
        </div>

        <button onclick="openGame()">🚀 直接跳轉至遊戲並啟用外掛</button>
    </div>

<script>
    function openGame() {
        const gameUrl = document.getElementById('server-select').value;
        // 直接將頁面跳轉至遊戲伺服器
        window.location.href = gameUrl;
    }
</script>
</body>
</html>
