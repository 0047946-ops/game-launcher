<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>放置天堂 - 跨平台萬能啟動器</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f39c12;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        select, input[type="file"], textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .custom-box {
            background-color: #262626;
            border: 1px dashed var(--accent-color);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .status-text {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 6px;
            word-break: break-all;
        }

        .btn-launch {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 15px;
        }

        .btn-launch:hover {
            background-color: #d35400;
            color: #fff;
        }

        .btn-action {
            width: 48%;
            padding: 10px;
            background-color: #333;
            color: #fff;
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-action:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚔️ 放置天堂萬能啟動器</h1>

    <!-- 伺服器與模式選擇 -->
    <div class="form-group">
        <label for="server-select">🌐 選擇伺服器與模式：</label>
        <select id="server-select">
            <option value="https://shines871.github.io/idle-lineage-class/">伺服器一 (shines871 - 增強外掛/掛機模式)</option>
            <option value="https://pp771007.github.io/idle-lineage-class/">伺服器二 (pp771007 - 雙外掛模式)</option>
            <option value="https://shines871.github.io/idle-lineage-class/?mode=clean">原版純淨模式一 (100% 無外掛)</option>
            <option value="https://pp771007.github.io/idle-lineage-class/?mode=clean">原版純淨模式二 (100% 無外掛)</option>
        </select>
    </div>

    <!-- 遊戲進度 匯出/匯入 功能區域 -->
    <div class="form-group custom-box">
        <label>💾 遊戲進度備份與還原：</label>
        <div class="btn-group">
            <button class="btn-action" onclick="exportSaveData()">📤 匯出進度檔</button>
            <button class="btn-action" onclick="toggleImportArea()">📥 貼上匯入文字</button>
        </div>
        
        <input type="file" id="import-save-file" accept=".json,.txt" style="display: none;" onchange="importSaveDataFromFile(event)">

        <div id="export-text-container" style="display:none; margin-top:10px;">
            <label style="font-size:0.8rem; color:#f39c12;">📋 導出的存檔碼 (已自動複製)：</label>
            <textarea id="export-textarea" rows="3" readonly style="font-size:0.75rem;"></textarea>
        </div>

        <div id="import-text-container" style="display:none; margin-top:10px;">
            <label style="font-size:0.8rem; color:#2ecc71;">📥 請在此貼上存檔文字：</label>
            <textarea id="import-textarea" rows="3" placeholder="請貼上存檔碼..." style="font-size:0.75rem;"></textarea>
            <div class="btn-group" style="margin-top:6px;">
                <button class="btn-action" style="width:100%; background-color:#27ae60;" onclick="saveImportTextToMemory()">✅ 暫存存檔並準備啟動</button>
            </div>
        </div>
    </div>

    <!-- 玩家自訂本地外掛 -->
    <div class="form-group custom-box">
        <label for="plugin-file">🧩 自訂本地外掛檔案（選填）：</label>
        <input type="file" id="plugin-file" accept=".js,.txt">
        <div id="plugin-status" class="status-text">未載入任何自訂腳本</div>
        <button id="clear-plugin" class="clear-btn" style="display:none;" onclick="clearCustomPlugin()">清除記憶的自訂外掛</button>
    </div>

    <!-- 啟動按鈕 -->
    <button class="btn-launch" onclick="launchGame()">🚀 啟動遊戲</button>
</div>

<script>
    const CURRENT_APK_VERSION = "1.2.0";

    // 0. 防快取跳轉
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (!urlParams.has('v')) {
            const separator = window.location.href.includes('?') ? '&' : '?';
            window.location.replace(window.location.href + separator + 'v=' + Date.now());
            return;
        }
    })();

    // 1. 初始化檢查
    window.addEventListener('DOMContentLoaded', () => {
        const savedPlugin = localStorage.getItem('custom_plugin_code');
        const savedFileName = localStorage.getItem('custom_plugin_name');
        if (savedPlugin && savedFileName) {
            document.getElementById('plugin-status').innerText = `已成功記憶：${savedFileName}`;
            document.getElementById('plugin-status').style.color = '#2ecc71';
            document.getElementById('clear-plugin').style.display = 'inline-block';
        }
    });

    // 2. 暫存匯入字串
    function saveImportTextToMemory() {
        const val = document.getElementById('import-textarea').value.trim();
        if (!val) {
            alert('請先輸入或貼上存檔碼！');
            return;
        }
        localStorage.setItem('temp_import_data', val);
        alert('存檔已成功暫存！點擊「🚀 啟動遊戲」即可自動注入角色。');
    }

    function toggleImportArea() {
        document.getElementById('export-text-container').style.display = 'none';
        const container = document.getElementById('import-text-container');
        container.style.display = (container.style.display === 'none' || container.style.display === '') ? 'block' : 'none';
    }

    function exportSaveData() {
        const saveData = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key !== 'custom_plugin_code' && key !== 'custom_plugin_name' && key !== 'temp_import_data') {
                saveData[key] = localStorage.getItem(key);
            }
        }
        const jsonString = JSON.stringify(saveData);
        document.getElementById('export-textarea').value = jsonString;
        document.getElementById('export-text-container').style.display = 'block';
        if (navigator.clipboard) navigator.clipboard.writeText(jsonString);
        alert('存檔已導出並複製到剪貼簿！');
    }

    function clearCustomPlugin() {
        localStorage.removeItem('custom_plugin_code');
        localStorage.removeItem('custom_plugin_name');
        document.getElementById('plugin-file').value = '';
        document.getElementById('plugin-status').innerText = '未載入任何自訂腳本';
        document.getElementById('plugin-status').style.color = '#aaa';
        document.getElementById('clear-plugin').style.display = 'none';
        alert('已清除自訂外掛設定！');
    }

    // 3. 啟動遊戲與自動解包注入
    function launchGame() {
        const targetUrl = document.getElementById('server-select').value;
        const tempData = localStorage.getItem('temp_import_data');

        // 將存檔數據攜帶於 URL 參數跳轉，解決 file:// 與 https:// 跨域問題
        let destination = targetUrl;
        if (tempData) {
            const sep = destination.includes('?') ? '&' : '?';
            destination += sep + 'force_save=' + encodeURIComponent(tempData);
        }

        window.location.href = destination;
    }
</script>

</body>
</html>
