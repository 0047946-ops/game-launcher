<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>放置天堂 - 100% 同步門戶 v3.7</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #66fcf1;
            --text-color: #c5c6c7;
            --border-color: #45a29e;
            --success: #00ff41;
            --error: #ff6b6b;
            --warning: #ffa500;
        }
        body {
            margin:0; padding:0; background:var(--bg-color); color:var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display:flex; justify-content:center; align-items:center; min-height:100vh;
        }
        .launcher-card {
            width: 92%; max-width: 560px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 16px;
            padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.9);
        }
        .header-title { 
            font-size: 1.45rem; text-align:center; color:var(--accent-color); 
            margin:0 0 10px 0; font-weight:900; 
        }
        .version-badge {
            text-align: center; font-size: 0.75rem; color: var(--warning);
            margin-bottom: 16px; font-weight: bold;
        }
        .section-box {
            border: 1px dashed var(--border-color); padding:16px; border-radius:12px;
            background:#0b0c10; margin-bottom:18px;
        }
        .form-label { display:block; font-weight:700; margin-bottom:8px; color:var(--accent-color); }
        .custom-input, .custom-textarea {
            width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-color);
            background:#1f2833; color:#fff; box-sizing:border-box; font-size:0.85rem;
        }
        .custom-textarea { min-height:80px; resize:vertical; font-family: monospace; font-size: 0.75rem; }
        .btn-main {
            width:100%; padding:16px; margin:12px 0 8px;
            background:linear-gradient(135deg, #66fcf1, #45a29e);
            color:#0b0c10; border:none; border-radius:10px; font-size:1.1rem; font-weight:900;
            cursor:pointer; transition: all 0.3s;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,252,241,0.3); }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-sub {
            padding:10px 12px; background:#1f2833; color:var(--accent-color);
            border:1px solid var(--accent-color); border-radius:6px; cursor:pointer;
            font-size: 0.75rem; font-weight: 600;
        }
        .btn-sub:hover { background: var(--accent-color); color: #0b0c10; }
        .status-box {
            margin-top:12px; padding:12px; border-radius:8px; font-size:0.8rem;
            background: rgba(0,0,0,0.4); border: 1px solid var(--border-color);
        }
        .status-info { color: var(--accent-color); }
        .status-success { color: var(--success); }
        .status-error { color: var(--error); }
        .status-warning { color: var(--warning); }
        .button-group { display:flex; gap:8px; margin-top:10px; flex-wrap: wrap; }
        .button-group > * { flex: 1; min-width: 75px; }
        .sync-guide { 
            background: rgba(102,252,241,0.1); border: 1px solid var(--accent-color);
            padding: 12px; border-radius: 8px; font-size: 0.8rem; margin: 12px 0;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="launcher-card">
    <h1 class="header-title">⚔️ 放置天堂 - 同步門戶 v3.7</h1>
    <div class="version-badge">✨ 萬能 SIG1 容錯解構器 | 雙軌動態注入</div>

    <!-- 伺服器選擇 -->
    <div class="section-box">
        <label class="form-label">🌐 選擇目標伺服器</label>
        <select id="server-select" class="custom-input">
            <option value="shines871">伺服器一 (shines871 - 離線增強模式)</option>
            <option value="pp771007">伺服器二 (pp771007 - 雙外掛模式)</option>
        </select>
    </div>

    <!-- 同步指南 -->
    <div class="sync-guide">
        <strong>📋 使用說明：</strong><br>
        <strong style="color: #00ff41;">🟢 情況 A：APK → 網頁</strong><br>
        1. 在 APK 內遊玩完成<br>
        2. APK 設定→備份存檔→導出 JSON 或 SIG1<br>
        3. 把文字或檔案內容貼到下方<br>
        4. 點「🚀 進入遊戲」即可在網頁版還原<br>
        <br>
        <strong style="color: #66fcf1;">🟦 情況 B：網頁 → APK</strong><br>
        1. 先在網頁版進入遊戲（任意伺服器）<br>
        2. 點「📤 導出存檔」下載 JSON<br>
        3. 把 JSON 貼到 APK<br>
        4. APK 設定→備份存檔→匯入 JSON
    </div>

    <!-- 角色資料 -->
    <div class="section-box">
        <label class="form-label">📦 貼上 JSON 或 SIG1 存檔</label>
        <textarea id="save-json-textarea" class="custom-textarea" placeholder="從 APK 或網頁導出的 JSON / SIG1 內容"></textarea>
        
        <div class="button-group">
            <button class="btn-sub" onclick="document.getElementById('json-file-input').click()">📁 讀取檔案</button>
            <button class="btn-sub" onclick="exportFromGame()">📤 導出存檔</button>
            <button class="btn-sub" onclick="validateData()">✓ 驗證</button>
        </div>
        <input type="file" id="json-file-input" accept=".json,.txt" style="display:none;" onchange="handleFileSelect(event)">

        <!-- 資料檢驗 -->
        <div id="validation-status" class="status-box" style="display:none;">
            <div id="validation-content"></div>
        </div>
    </div>

    <!-- 主按鈕 -->
    <button class="btn-main" id="launch-btn" onclick="launchGameWithURL()">🚀 進入遊戲（注入存檔）</button>
    <button class="btn-main" id="clear-btn" style="background: linear-gradient(135deg, #ff6b6b, #ff4757); margin-top: 0;" onclick="clearBeforeLaunch()">🗑️ 清空舊資料後進入</button>

    <!-- 狀態訊息 -->
    <div id="status-message" class="status-box" style="display:none;">
        <div id="status-content"></div>
    </div>
</div>

<script>
    const CONFIG = {
        GAME_SAVE_KEYS: [
            'lineage_idle_save_1', 'lineage_idle_save_2', 'lineage_idle_save_3', 'lineage_idle_save_4',
            'lineage_idle_warehouse_classic', 'lineage_idle_warehouse_normal',
            'lineage_idle_warehouse_traditional', 'lineage_idle_warehouse_traditional_normal',
            'lineage_idle_pets_classic', 'lineage_idle_pets_normal',
            'lineage_idle_pets_traditional', 'lineage_idle_pets_traditional_normal',
            'lineage_idle_dex_equipt_classic', 'lineage_idle_dex_equipt_normal',
            'lineage_idle_dex_relic_classic', 'lineage_idle_dex_relic_normal',
            'lineage_idle_dex_misc_classic', 'lineage_idle_dex_misc_normal',
            'lineage_idle_dex_cardex_classic', 'lineage_idle_dex_cardex_normal'
        ],
        SERVER_URLS: {
            'shines871': 'https://shines871.github.io/idle-lineage-class/',
            'pp771007': 'https://pp771007.github.io/idle-lineage-class/'
        }
    };

    // ===== 🔥 v3.7 萬能 SIG1 容錯解構器 =====
    function parseSIG1(rawData) {
        if (typeof rawData !== 'string') return null;

        // 1. 預先清除不可見字元與換行符號
        let cleanText = rawData.replace(/[\r\n\t\s]/g, '');

        if (!cleanText.startsWith('SIG1:')) {
            return cleanText; // 不是 SIG1，直接返回原文
        }

        console.log('[parseSIG1] 開始進行深度 SIG1 解碼，總長度:', cleanText.length);

        try {
            // 2. 切除 SIG1: 前綴
            let body = cleanText.substring(5);
            let base64Candidate = '';

            // 3. 處理包含多重冒號的狀況，抓取最後一段或主體段落
            if (body.includes(':')) {
                const parts = body.split(':');
                // 優先過濾出最長且符合 Base64 特徵的區塊
                base64Candidate = parts.reduce((a, b) => a.length > b.length ? a : b);
            } else {
                base64Candidate = body;
            }

            // 4. 清理 Base64 字串中的非法字元，確保完整性
            base64Candidate = base64Candidate.replace(/[^A-Za-z0-9+/=]/g, '');

            // 5. 自動補齊 Base64 的 `=` 號 padding
            while (base64Candidate.length % 4 !== 0) {
                base64Candidate += '=';
            }

            // 6. 執行跨端二進位 UTF-8 安全解碼 (避免中文亂碼與 atob 崩潰)
            const binaryStr = atob(base64Candidate);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
            
            const decodedResult = new TextDecoder('utf-8').decode(bytes);
            console.log('[parseSIG1] 解碼成功！前 60 字元:', decodedResult.substring(0, 60));
            return decodedResult;

        } catch (e) {
            console.error('[parseSIG1] 嘗試標準解碼失敗，啟用降級向下相容模式...', e);
            try {
                // 降級備用模式：強制提取正則匹配
                const match = cleanText.match(/[A-Za-z0-9+/]{20,}={0,2}/);
                if (match) {
                    return decodeURIComponent(escape(atob(match[0])));
                }
            } catch (err) {
                console.error('[parseSIG1] 降級模式亦失敗:', err);
            }
            return null;
        }
    }

    function showStatus(message, type = 'info') {
        const statusEl = document.getElementById('status-message');
        const contentEl = document.getElementById('status-content');
        contentEl.innerHTML = `<span class="status-${type}">${message}</span>`;
        statusEl.style.display = 'block';
    }

    function showValidation(content) {
        const validationEl = document.getElementById('validation-status');
        const contentEl = document.getElementById('validation-content');
        contentEl.innerHTML = content;
        validationEl.style.display = 'block';
    }

    function validateData() {
        const input = document.getElementById('save-json-textarea').value.trim();
        
        if (!input) {
            showValidation(`<span class="status-error">❌ 請先輸入資料</span>`);
            return;
        }

        try {
            let data = input;

            if (input.startsWith('SIG1:')) {
                const decoded = parseSIG1(input);
                if (!decoded) {
                    showValidation(`<span class="status-error">❌ SIG1 簽章解構失敗<br>請確認複製的存檔文字是否完整</span>`);
                    return;
                }
                data = decoded;
            }

            const parsed = JSON.parse(data);
            const saveKeys = CONFIG.GAME_SAVE_KEYS.filter(key => parsed.hasOwnProperty(key));
            const sizeKB = (new Blob([data]).size / 1024).toFixed(2);
            
            let validationHTML = `
                <div><span class="status-success">✓ SIG1 / JSON 解析成功！</span></div>
                <div style="margin-top: 8px; font-size: 0.75rem;">
                    <div>📊 解構後大小: ${sizeKB} KB</div>
                    <div>💾 辨識項目: ${saveKeys.length}/${CONFIG.GAME_SAVE_KEYS.length}</div>
                </div>
            `;
            
            if (saveKeys.length === 0) {
                validationHTML += `<div style="margin-top: 8px; color: var(--warning);">⚠️ 提醒：該 JSON 為特殊/自訂格式，進入遊戲時將嘗試強制寫入</div>`;
            }
            
            showValidation(validationHTML);
        } catch(e) {
            console.error('[validateData] 驗證失敗:', e);
            showValidation(`<span class="status-error">❌ JSON 結構不完整: ${e.message}</span>`);
        }
    }

    function exportFromGame() {
        showStatus('💡 此按鈕需要在遊戲內使用（有存檔時）<br>建議: 進入遊戲後點擊「備份存檔」→「導出 JSON」', 'info');
    }

    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const content = ev.target.result;
                document.getElementById('save-json-textarea').value = content;
                showStatus('✅ 檔案讀取成功！', 'success');
                setTimeout(() => validateData(), 300);
            } catch(e) {
                showStatus(`❌ 檔案讀取失敗: ${e.message}`, 'error');
            }
        };
        reader.readAsText(file);
    }

    function launchGameWithURL() {
        const dataStr = document.getElementById('save-json-textarea').value.trim();
        
        if (!dataStr) {
            showStatus('⚠️ 請先輸入存檔資料', 'warning');
            return;
        }

        try {
            let data = dataStr;

            if (dataStr.startsWith('SIG1:')) {
                const decoded = parseSIG1(dataStr);
                if (!decoded) throw new Error('SIG1 解析失敗，請檢查資料字串');
                data = decoded;
            }

            // 驗證是否為合法 JSON
            JSON.parse(data);

            const serverKey = document.getElementById('server-select').value;
            const baseUrl = CONFIG.SERVER_URLS[serverKey];
            
            // 寫入 localStorage 做全域載荷備份
            localStorage.setItem('PRELOAD_INJECT_SAVE', data);

            const encoded = encodeURIComponent(data);
            const finalUrl = baseUrl + '#inject_save=' + encoded;

            showStatus('⏳ 正在注入存檔並啟動遊戲...', 'info');
            
            setTimeout(() => {
                window.location.href = finalUrl;
            }, 400);
            
        } catch(e) {
            console.error('[launchGameWithURL] 錯誤:', e);
            showStatus(`❌ 注入失敗: ${e.message}`, 'error');
        }
    }

    function clearBeforeLaunch() {
        if (confirm('⚠️ 進入遊戲前會清空本機舊資料，確定要繼續嗎？')) {
            try {
                CONFIG.GAME_SAVE_KEYS.forEach(key => {
                    localStorage.removeItem(key);
                });

                const serverKey = document.getElementById('server-select').value;
                const baseUrl = CONFIG.SERVER_URLS[serverKey];
                
                showStatus('✅ 已清空舊資料，正在進入遊戲...', 'success');
                setTimeout(() => {
                    window.location.href = baseUrl;
                }, 400);
            } catch(e) {
                showStatus(`❌ 錯誤: ${e.message}`, 'error');
            }
        }
    }

    window.addEventListener('load', () => {
        const existingData = {};
        CONFIG.GAME_SAVE_KEYS.forEach(key => {
            const value = localStorage.getItem(key);
            if (value) existingData[key] = value;
        });

        if (Object.keys(existingData).length > 0) {
            showStatus(`📂 本機偵測到 ${Object.keys(existingData).length} 項舊遊戲資料`, 'info');
        }
    });
</script>
</body>
</html>
