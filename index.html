<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 企業級防快取標籤配置 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>放置天堂 - 商業級全能啟動器</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #181818;
            --accent-color: #f39c12;
            --accent-hover: #d35400;
            --text-color: #e0e0e0;
            --border-color: #2c2c2c;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .launcher-card {
            width: 92%;
            max-width: 460px;
            margin: 20px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
        }

        .header-title {
            font-size: 1.4rem;
            text-align: center;
            color: var(--accent-color);
            margin: 0 0 20px 0;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #bbb;
        }

        .custom-select, .custom-input, .custom-textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #242424;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .custom-select:focus, .custom-input:focus, .custom-textarea:focus {
            border-color: var(--accent-color);
        }

        .plugin-section {
            border: 1px dashed var(--border-color);
            padding: 12px;
            border-radius: 10px;
            background-color: #121212;
            margin-bottom: 16px;
        }

        .btn-launch {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            transition: transform 0.1s ease;
        }

        .btn-launch:active {
            transform: scale(0.98);
        }

        .btn-action {
            padding: 8px 12px;
            background: #333;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 6px;
        }

        .plugin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 0.8rem;
            border: 1px solid #333;
        }

        .plugin-url {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
            color: #ddd;
        }

        .btn-delete {
            background: var(--danger-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .system-status {
            margin-top: 16px;
            font-size: 0.82rem;
            color: #777;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="launcher-ui" class="launcher-card">
    <h1 class="header-title">⚔️ 放置天堂萬能啟動器</h1>

    <!-- 1. 運行伺服器節點選擇 -->
    <div class="form-group">
        <label class="form-label" for="server-select">🌐 選擇運行伺服器：</label>
        <select id="server-select" class="custom-select">
            <option value="https://pp771007.github.io/idle-lineage-class/">伺服器二 (pp771007 - 雙外掛模式)</option>
            <option value="https://shines871.github.io/idle-lineage-class/">伺服器一 (shines871 - 掛機模式)</option>
        </select>
    </div>

    <!-- 2. 存檔快捷同步工具 -->
    <div class="plugin-section">
        <label class="form-label">💾 網頁版角色快速同步（一次性貼上寫入）：</label>
        <textarea id="save-input" class="custom-textarea" rows="2" placeholder="貼上從 Chrome 網頁版複製的存檔文字..."></textarea>
        <button class="btn-action" style="width:100%; background:#27ae60; color:#fff; border:none;" onclick="importSaveData()">📥 寫入角色存檔至 APK</button>
    </div>

    <!-- 3. 玩家自訂外掛腳本管理區 -->
    <div class="plugin-section">
        <label class="form-label">🧩 玩家自訂外掛腳本管理：</label>
        <input type="text" id="plugin-input" class="custom-input" placeholder="貼上腳本網址 (https://...)">
        <button class="btn-action" style="width:100%;" onclick="addPlugin()">➕ 新增自訂外掛腳本</button>
        <div id="plugin-list"></div>
    </div>

    <!-- 4. 啟動遊戲引擎按鈕 -->
    <button class="btn-launch" onclick="startGameEngine()">🚀 啟動遊戲並載入外掛</button>

    <div id="status-display" class="system-status">當前版本 v1.2.0 | 自動版本檢查鏈與腳本模組已就緒</div>
</div>

<script>
    // 核心基礎配置參數
    const CURRENT_SYSTEM_VERSION = "1.2.0";
    const REMOTE_CONFIG_ENDPOINT = "https://0047946-ops.github.io/game-launcher/version.json";
    const STORAGE_KEY_PLUGINS = "USER_CUSTOM_PLUGINS";

    // 初始化載入
    document.addEventListener("DOMContentLoaded", () => {
        executeVersionCheck();
        renderPlugins();
    });

    // 1. 自動版本檢查與熱更新機制
    function executeVersionCheck() {
        const currentUrl = new URL(window.location.href);
        if (!currentUrl.searchParams.has('v')) {
            currentUrl.searchParams.set('v', Date.now().toString());
            window.location.replace(currentUrl.toString());
            return;
        }

        fetch(`${REMOTE_CONFIG_ENDPOINT}?t=${Date.now()}`)
            .then(res => res.json())
            .then(data => {
                if (data.latestVersion && data.latestVersion !== CURRENT_SYSTEM_VERSION) {
                    if (confirm(`🎉 發現最新系統版本 (v${data.latestVersion})！\n\n更新說明：\n${data.updateLog || '性能優化與底層修復'}\n\n是否立即前往下載最新版本？`)) {
                        window.location.href = data.downloadUrl;
                    }
                }
            })
            .catch(err => {
                console.log("版本號檢查失敗或處於離線狀態:", err);
            });
    }

    // 2. 讀取並渲染已儲存的玩家自訂腳本
    function getPlugins() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY_PLUGINS)) || [];
        } catch(e) { 
            return []; 
        }
    }

    function renderPlugins() {
        const listContainer = document.getElementById('plugin-list');
        const plugins = getPlugins();
        listContainer.innerHTML = "";

        if (plugins.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; color:#555; font-size:0.78rem; padding:6px 0 0 0;">無自訂腳本 (預設自動載入官方外掛)</div>`;
            return;
        }

        plugins.forEach((url, index) => {
            const item = document.createElement('div');
            item.className = 'plugin-item';
            item.innerHTML = `
                <span class="plugin-url" title="${url}">${url}</span>
                <button class="btn-delete" onclick="removePlugin(${index})">刪除</button>
            `;
            listContainer.appendChild(item);
        });
    }

    function addPlugin() {
        const input = document.getElementById('plugin-input');
        const url = input.value.trim();
        if (!url || !url.startsWith('http')) {
            alert('請輸入有效的 HTTP / HTTPS 腳本網址！');
            return;
        }

        const plugins = getPlugins();
        if (plugins.includes(url)) {
            alert('該外掛腳本網址已存在！');
            return;
        }

        plugins.push(url);
        localStorage.setItem(STORAGE_KEY_PLUGINS, JSON.stringify(plugins));
        input.value = "";
        renderPlugins();
    }

    function removePlugin(index) {
        const plugins = getPlugins();
        plugins.splice(index, 1);
        localStorage.setItem(STORAGE_KEY_PLUGINS, JSON.stringify(plugins));
        renderPlugins();
    }

    // 3. 寫入角色存檔至 LocalStorage
    function importSaveData() {
        const str = document.getElementById('save-input').value.trim();
        if (!str) {
            alert('請先貼上存檔文字資料！');
            return;
        }

        try {
            const data = JSON.parse(str);
            if (typeof data === 'object') {
                Object.keys(data).forEach(k => localStorage.setItem(k, data[k]));
                alert('✅ 角色已成功寫入 APK！現在點擊下方按鈕即可進入遊戲。');
                document.getElementById('save-input').value = "";
            }
        } catch(e) {
            alert('❌ 存檔格式不正確，請確認複製內容！');
        }
    }

    // 4. 啟動遊戲並自動注入所有外掛腳本
    function startGameEngine() {
        const targetUrl = document.getElementById('server-select').value;
        const statusElement = document.getElementById('status-display');
        
        statusElement.innerText = "正在載入遊戲頁面與動態注入外掛鏈...";
        statusElement.style.color = "#f39c12";

        // 隱藏選單面板
        document.getElementById('launcher-ui').style.display = 'none';

        // 抓取目標伺服器 HTML 並寫入當前網域空間
        fetch(targetUrl)
            .then(res => res.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();

                // 待 DOM 載入後逐一動態掛載腳本
                setTimeout(() => {
                    // 官方主外掛鏈
                    injectScript('https://cdn.jsdelivr.net/gh/qcc781192000/idle-lineage-plugin@main/main.user.js');
                    // GM 商店腳本
                    injectScript('https://kid0924.github.io/idle-lineage-class/klh_GMShop.js?t=' + Date.now());

                    // 伺服器專用離線掛機補丁
                    if (targetUrl.includes('shines871.github.io')) {
                        injectScript('https://pp771007.github.io/idle-lineage-class/offline.js?t=' + Date.now());
                    }

                    // 玩家自訂腳本鏈
                    getPlugins().forEach(scriptUrl => {
                        injectScript(scriptUrl);
                    });
                }, 800);
            })
            .catch(() => {
                window.location.href = targetUrl;
            });
    }

    function injectScript(src) {
        const s = document.createElement('script');
        s.src = src;
        document.head.appendChild(s);
    }
</script>

</body>
</html>
