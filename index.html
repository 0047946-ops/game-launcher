<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放置天堂雙外掛終極啟動器</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #e0e0e0; }
        #menu { padding: 30px; max-width: 480px; margin: 50px auto; background: #1e1e1e; border-radius: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.7); border: 1px solid #333; }
        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #00adb5; font-weight: bold; font-size: 15px; }
        select { width: 100%; padding: 14px; box-sizing: border-box; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 15px; outline: none; }
        button { width: 100%; padding: 16px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(40,167,69,0.3); }
        #game-container { width: 100%; height: 100%; display: none; position: absolute; top: 0; left: 0; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }
        #status-bar { position: fixed; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.9); color: #00adb5; text-align: center; font-size: 13px; padding: 8px 0; z-index: 999; display: none; border-bottom: 1px solid #00adb5; }
    </style>
</head>
<body>

    <div id="status-bar">正在載入遊戲與注入雙外掛...</div>

    <!-- 啟動選單 -->
    <div id="menu">
        <h2 style="text-align:center; margin-top:0; color:#fff;">🎮 放置天堂雙外掛終極啟動器</h2>
        <p style="text-align:center; color:#888; font-size:13px; margin-bottom:25px;">Android APK 專用無縫注入版</p>
        
        <div class="group">
            <label>選擇遊戲伺服器：</label>
            <select id="server-select">
                <option value="https://shines871.github.io/idle-lineage-class/">伺服器二 (shines871)</option>
                <option value="https://pp771007.github.io/idle-lineage-class/">伺服器一 (pp771007)</option>
            </select>
        </div>

        <button onclick="launchGame()">🚀 啟動遊戲並載入雙外掛</button>
    </div>

    <!-- 遊戲載入畫面 -->
    <div id="game-container">
        <iframe id="game-frame"></iframe>
    </div>

<script>
    async function launchGame() {
        const gameUrl = document.getElementById('server-select').value;
        const statusBar = document.getElementById('status-bar');

        document.getElementById('menu').style.display = 'none';
        statusBar.style.display = 'block';
        document.getElementById('game-container').style.display = 'block';

        const frame = document.getElementById('game-frame');

        try {
            statusBar.innerText = '正在抓取遊戲主體並融合外掛...';
            
            // 透過 fetch 抓取遊戲頁面原始碼
            const response = await fetch(gameUrl);
            let html = await response.text();

            // 準備要注入的外掛標籤與 Base 標籤
            const injectContent = `
                <base href="${gameUrl}">
                <!-- 主外掛腳本 -->
                <script src="https://raw.githubusercontent.com/qcc781192000/idle-lineage-plugin/main/main.user.js"><\/script>
                <!-- GM 商店腳本 -->
                <script src="https://kid0924.github.io/idle-lineage-class/klh_GMShop.js?t=${Date.now()}"><\/script>
            `;

            // 將注入內容放在 <head> 標籤的最上方
            if (html.includes('<head>')) {
                html = html.replace('<head>', '<head>' + injectContent);
            } else {
                html = injectContent + html;
            }

            // 將融合後的 HTML 直接寫入 iframe
            frame.srcdoc = html;

            statusBar.innerText = '✅ 遊戲與雙外掛已完美融合載入！';
            setTimeout(() => { statusBar.style.display = 'none'; }, 3000);

        } catch (err) {
            console.error('Fetch 代理注入失敗，切換為標準載入:', err);
            statusBar.innerText = '⚠️ 切換至標準模式載入遊戲...';
            frame.src = gameUrl;
            setTimeout(() => { statusBar.style.display = 'none'; }, 3000);
        }
    }
</script>
</body>
</html>
